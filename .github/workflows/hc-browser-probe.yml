name: HC Browser Probe (一次性診斷)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install deps
        run: pip install -q requests beautifulsoup4 cloudscraper seleniumbase

      - name: Probe
        env:
          HIDEN_COOKIE: ${{ secrets.HIDEN_COOKIE }}
        run: python .github/hc_browser_probe.py